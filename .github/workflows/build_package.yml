name: Build package

on:
  workflow_dispatch:
  workflow_call:
  push:

jobs:
  build:
    strategy:
      matrix:
        os_arch:
          [
            { os: windows-2022, arch: x64 },
            { os: macos-15, arch: arm64 },
            { os: ubuntu-24.04, arch: x64 }
          ]
        py: ["3.12"]

    runs-on: ${{ matrix.os_arch.os }}

    env:
      OS_ARCH: ${{ matrix.os_arch.os }}-${{ matrix.os_arch.arch }}

    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.py }}

      - name: Install build tools
        run: pip install conan ninja build twine pytest numpy

      - name: Install build tools (Ubuntu)
        if: matrix.os_arch.os == 'ubuntu-24.04'
        run: |
          pip install auditwheel

      - name: Install build tools (MacOS)
        if: matrix.os_arch.os == 'macos-15'
        run: |
          pip install delocate

      - name: conan cache
        id: conan_cache
        uses: actions/cache@v5
        with:
          path: ~/.conan2
          key: ${{ env.OS_ARCH }}-conan

      - name: Setup Compiler (Windows)
        uses: ilammy/msvc-dev-cmd@138b1c783b65ec697d8342918306b7b2db4e88f1
        if: matrix.os_arch.os == 'windows-2022'

      - name: Setup Compiler (MacOS)
        if: matrix.os_arch.os == 'macos-15'
        run: |
          echo "CC=$(brew --prefix llvm@18)/bin/clang" >> $GITHUB_ENV
          echo "CXX=$(brew --prefix llvm@18)/bin/clang++" >> $GITHUB_ENV
          sed -i '' '/^#define _LIBCPP_HAS_NO_VENDOR_AVAILABILITY_ANNOTATIONS/d' "$(brew --prefix llvm@18)"/include/c++/v1/__config_site

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Conan setup
        run: |
          conan config install .github/conan_profiles/${{ env.OS_ARCH }} -tf profiles
          git clone https://github.com/kontex-neuro/kontex-conan.git kontex-conan
          conan remote add --force kontex-neuro ./kontex-conan

      - name: Build and install pylibxdaq
        working-directory: ./pylibxdaq
        run: |
          conan install . --build=missing --profile:all ${{ env.OS_ARCH }} -s build_type=Release -of ..
          cmake -S . -B ../build/Release --preset conan-release -DCMAKE_INSTALL_PREFIX="../pylibxdaq"
          cmake --build ../build/Release --preset conan-release --target install
      
      - name: Build package
        run: |
          python -m build -w

      - name: Run tests
        run: |
          ctest --test-dir build/Release --output-on-failure
          pip install $(find dist -name '*.whl')
          pytest tests --log-cli-level=INFO

      - name: Fix binary and upload (Ubuntu)
        if: matrix.os_arch.os == 'ubuntu-24.04'
        run: |
          export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$(pwd)/pylibxdaq
          auditwheel repair --plat manylinux_2_39_x86_64 $(find dist -name '*.whl') --exclude 'libudev.*'
          rm -r dist && mv wheelhouse dist

      - name: Fix binary and upload (MacOS)
        if: matrix.os_arch.os == 'macos-15'
        run: |
          export DYLD_LIBRARY_PATH=$DYLD_LIBRARY_PATH:$(pwd)/pylibxdaq
          delocate-wheel -w fixed_wheels -v $(find dist -name '*.whl')
          rm -r dist && mv fixed_wheels dist
      
      - name: Smoke test final wheel in isolation
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          import tempfile
          import venv

          wheels = list(Path("dist").resolve().glob("*.whl"))
          assert len(wheels) == 1, wheels
          with tempfile.TemporaryDirectory() as temporary:
              environment = Path(temporary) / "venv"
              venv.EnvBuilder(with_pip=True).create(environment)
              python = environment / ("Scripts/python.exe" if os.name == "nt" else "bin/python")
              subprocess.run([str(python), "-I", "-m", "pip", "install", str(wheels[0])], check=True, cwd=temporary)
              subprocess.run(
                  [str(python), "-I", "-c",
                   "import numpy; from pylibxdaq import pyxdaq_device, xdaqnp; "
                   "assert all(hasattr(xdaqnp, name) for name in xdaqnp.__all__)"],
                  check=True, cwd=temporary,
              )

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.OS_ARCH }}
          path: dist/*.whl
